# Spatial Blueprint · NeoForge 1.21.1 移植线（与 main 分支的 Forge 1.20.1 线并行维护，同一 GitHub 仓库的 neoforge-1.21.1 分支）
# 代理不写在这里：本机的代理在用户级 ~/.gradle/gradle.properties，云端会话没有这个代理
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment Properties
# Parchment 映射：https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# 与 Healthy_Diets 1.21.1 线同版本（21.1.252 为 1.21.1 最终版）
neo_version=21.1.252
loader_version_range=[1,)

## Mod Properties
# mod_id / 包根 / 物品 ID 与 1.20.1 线完全一致
mod_id=spatial_blueprint
mod_name=Spatial Blueprint
mod_license=All Rights Reserved
# 1.21.1 线从 3.0.0 起（1.20.1 线是 2.x）；每次部署末位 +1，到 9 进位（x.y.9 → x.(y+1).0）
mod_version=3.0.0
mod_group_id=com.xioyim.spatialblueprint
mod_authors=xioyim
mod_description=A spatial blueprint mod for capturing and placing structures.\nSelect points to capture an area, then place it anywhere.
